apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 65.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      prometheusSpec:
        # ⏱️ Data retention for metrics
        retention: 7d
        # retentionSize: 8Gi   # optional alternative / extra limit
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500"
            memory: "512Mi"
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: linode-block-storage-retain
              resources:
                requests:
                  storage: 2Gi

    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      image:
        repository: grafana/grafana
        tag: 11.2.2

      persistence:
        enabled: true
        storageClassName: linode-block-storage-retain
        size: 2Gi

      # Basic hardening
      grafana.ini:
        security:
          allow_embedding: false
          # cookie_secure: true # Grafana behind HTTPS (Ingress / Istio with TLS)
          # cookie_samesite: strict
        cookie_secure: false # 👈 IMPORTANT: false while you're on HTTP
        cookie_samesite: lax # 👈 more forgiving; 'strict' can be annoying
        auth.anonymous:
          enabled: false
        users:
          allow_sign_up: false

      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      ingress:
        enabled: false

      service:
        type: ClusterIP
        port: 3000
        targetPort: 3000

      additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          timeInterval: "10s"
          maxLines: 1000
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "fake"

      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards

      dashboards:
        default:
          wordpress-logs:
            gnetId: 13638
            datasource: Prometheus

          loki-pods:
            gnetId: 14802
            datasource: Loki

          loki-namespace-pro:
            json: |
              {
                "id": null,
                "uid": "loki-namespace-pro",
                "title": "Loki - Namespace / Pod / Log Type",
                "tags": ["loki", "kubernetes", "logs"],
                "timezone": "browser",
                "schemaVersion": 38,
                "version": 1,
                "refresh": "10s",
                "editable": true,
                "templating": {
                  "list": [
                    {
                      "name": "namespace",
                      "label": "Namespace",
                      "type": "query",
                      "datasource": "Loki",
                      "query": "label_values({job!=\"\"}, namespace)",
                      "includeAll": true,
                      "allValue": ".*",
                      "multi": false,
                      "refresh": 2,
                      "sort": 1
                    },
                    {
                      "name": "pod",
                      "label": "Pod",
                      "type": "query",
                      "datasource": "Loki",
                      "query": "label_values({namespace=\"$namespace\"}, pod)",
                      "includeAll": true,
                      "allValue": ".*",
                      "multi": false,
                      "refresh": 2,
                      "sort": 1
                    },
                    {
                      "name": "log_type",
                      "label": "Log Type",
                      "type": "custom",
                      "query": "All : .*,Error : (?i)(error|fail|exception|production.ERROR|local.ERROR|CRITICAL|ALERT|EMERGENCY),Success : (?i)(success|info| 200 |status=200|OK),4xx : (?i)( 4[0-9]{2} |status=4[0-9]{2}),5xx : (?i)( 5[0-9]{2} |status=5[0-9]{2})",
                      "includeAll": false,
                      "multi": false,
                      "refresh": 2,
                      "sort": 1
                    }
                  ]
                },
                "panels": [
                  {
                    "type": "logs",
                    "title": "Logs (Namespace: $namespace, Pod: $pod, Type: $log_type)",
                    "id": 1,
                    "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
                    "datasource": "Loki",
                    "options": {
                      "showTime": true,
                      "showLabels": true,
                      "sortOrder": "Descending"
                    },
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"} |~ \"$log_type\""
                      }
                    ]
                  },
                  {
                    "type": "barchart",
                    "title": "Top Pods by Log Volume (Namespace: $namespace, Pod: $pod, last 5m)",
                    "id": 3,
                    "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
                    "datasource": "Loki",
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    },
                    "options": {
                      "legend": {
                        "displayMode": "list",
                        "placement": "right"
                      },
                      "tooltip": {
                        "mode": "single"
                      }
                    },
                    "targets": [
                      {
                        "refId": "A",
                        "expr": "topk(10, count_over_time({namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))"
                      }
                    ]
                  }
                ],
                "time": {
                  "from": "now-15m",
                  "to": "now"
                }
              }

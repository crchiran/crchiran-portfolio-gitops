apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: flux-system
spec:
  interval: 5m
  releaseName: promtail
  targetNamespace: monitoring
  chart:
    spec:
      chart: promtail
      version: 6.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    config:
      server:
        http_listen_port: 3101
        grpc_listen_port: 0

      positions:
        filename: /run/promtail/positions.yaml

      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
          batchwait: 1s
          batchsize: 1048576
          timeout: 10s
          external_labels:
            cluster: linode-prod

      limits_config:
        max_line_size: 65536
        readline_rate: 10240
        readline_burst: 10240
        max_streams: 10000

      scrape_configs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod

          pipeline_stages:
            - cri: {}
            - labeldrop:
                - filename

          relabel_configs:
            # 1) Only namespaces explicitly labeled for logging
            # kubectl label namespace <ns> logging=enabled
            - source_labels: [__meta_kubernetes_namespace_label_logging]
              action: keep
              regex: enabled

            # 2) Drop Loki/Promtail/Grafana logs to avoid log-loop + query noise
            # (works with Helm default label app.kubernetes.io/name)
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: drop
              regex: ^(loki|promtail|grafana)$

            # 3) Extra safety: drop obvious system namespaces if ever labeled by mistake
            - source_labels: [__meta_kubernetes_namespace]
              action: drop
              regex: ^(kube-system|kube-public|kube-node-lease|cert-manager|istio-system|metallb-system|flux-system|local-path-storage)$

            # 4) Drop pods annotated with promtail_ignore=true
            - source_labels: [__meta_kubernetes_pod_annotation_promtail_ignore]
              action: drop
              regex: true

            # 5) Drop mirror pods
            - source_labels: [__meta_kubernetes_pod_annotation_kubernetes_io_config_mirror]
              action: drop
              regex: ".+"

            # 6) Namespace / pod / container labels
            - action: replace
              source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - action: replace
              source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - action: replace
              source_labels: [__meta_kubernetes_pod_container_name]
              target_label: container

            # 7) Correct log file path
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_uid
                - __meta_kubernetes_pod_container_name
              separator: /
              target_label: __path__
              replacement: /var/log/pods/*$1/*$2/*.log

    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

    extraVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlib
        hostPath:
          path: /var/lib

    extraVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: varlib
        mountPath: /var/lib
        readOnly: true

    podAnnotations:
      sidecar.istio.io/inject: "false"

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: crchiran-portfolio-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/crchiran/crchiran-portfolio-gitops.git
  ref:
    branch: main
  secretRef:
    name: crchiran-portfolio-gitops-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crchiran-portfolio-prod
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/crchiran-portfolio
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: portfolio